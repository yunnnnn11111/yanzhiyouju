services:
  - type: web
    name: yanzhiyouju
    runtime: python
    plan: free
    buildCommand: python -m zipfile -e app-source.zip . && pip install -r requirements.txt
    startCommand: gunicorn cloud_app:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # Render free instances use an ephemeral disk. Point SYNC_* at a private
      # GitHub repository to keep users and batches across restarts.
      - key: SYNC_REPO
        sync: false
      - key: SYNC_TOKEN
        sync: false
      - key: SYNC_PATH
        value: store/yzyj-data.tar.gz
      - key: SYNC_BRANCH
        value: main
